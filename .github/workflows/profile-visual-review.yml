name: Profile visual review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-visual-review.yml'
permissions:
  contents: write
concurrency:
  group: profile-visual-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Capture dashboards and review desktop and mobile
        run: node .github/scripts/profile-review.mjs
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-visual-review
          path: review/
          retention-days: 14
      - name: Publish successful dashboard captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/previews/
          if ! git diff --cached --quiet; then
            git commit -m "Add verified dashboard screenshots to profile"
            git push
          fi
